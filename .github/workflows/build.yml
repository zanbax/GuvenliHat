name: APK oluştur

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: İmza anahtarını çöz
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -n "$SIGNING_PASSWORD" ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
              -in app/release.jks.enc -out app/release.jks -pass env:SIGNING_PASSWORD
            echo "Kalıcı anahtarla imzalanacak"
          else
            echo "::warning::SIGNING_PASSWORD tanımlı değil; deneme anahtarıyla imzalanıyor"
          fi

      - name: APK derle
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleFullRelease bundlePlayRelease assembleLegacyRelease --stacktrace
          cp app/build/outputs/apk/full/release/app-full-release.apk WeAreNear.apk
          cp app/build/outputs/bundle/playRelease/app-play-release.aab WeAreNear-play.aab
          cp app/build/outputs/apk/legacy/release/app-legacy-release.apk GuvenliHat-son-guncelleme.apk
          rm -f app/release.jks

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: WeAreNear-apk
          path: |
            WeAreNear.apk
            WeAreNear-play.aab
            GuvenliHat-son-guncelleme.apk

      - name: Sürümler (Releases) sayfasına koy
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: WeAreNear 0.1.${{ github.run_number }}
          body: "WeAreNear.apk: tam sürüm (testçiler için, telefondan indirip kurun). WeAreNear-play.aab: Google Play'e yüklenecek çekirdek sürüm. GuvenliHat-son-guncelleme.apk: eski Güvenli Hat'ı kullananlar için son güncelleme; WeAreNear'a geçişi anlatır ve yenisi devralınca susar."
          files: |
            WeAreNear.apk
            WeAreNear-play.aab
            GuvenliHat-son-guncelleme.apk
          make_latest: true
