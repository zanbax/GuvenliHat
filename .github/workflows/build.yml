name: APK oluştur

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: İmza anahtarını çöz
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          if [ -n "$SIGNING_PASSWORD" ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
              -in app/release.jks.enc -out app/release.jks -pass env:SIGNING_PASSWORD
            echo "Kalıcı anahtarla imzalanacak"
          else
            echo "::warning::SIGNING_PASSWORD tanımlı değil; deneme anahtarıyla imzalanıyor"
          fi

      - name: APK derle
        env:
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk GuvenliHat.apk
          rm -f app/release.jks

      - name: APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: GuvenliHat-apk
          path: GuvenliHat.apk

      - name: Sürümler (Releases) sayfasına koy
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Güvenli Hat 0.1.${{ github.run_number }}
          body: Telefondan GuvenliHat.apk dosyasına dokunup indirin ve kurun. Eski sürümün üzerine kurulur, ayarlar silinmez.
          files: GuvenliHat.apk
          make_latest: true
